# กัน Supabase แผนฟรีหยุด project เองเมื่อไม่มีการใช้งาน 1 สัปดาห์ (เช่นช่วงสอบ/ปิดเทอม)
# ทุก 3 วัน เรียก get_public_results ด้วย token ที่ไม่มีอยู่จริง: แตะฐานข้อมูลแบบอ่านอย่างเดียว ไม่มีข้อมูลรั่ว
#
# ตั้งค่าครั้งเดียว: GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL                 = https://<ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY     = sb_publishable_...   (key สาธารณะ ไม่ใช่ secret key)
# หมายเหตุ: GitHub ปิด schedule เองถ้า repo ไม่มี commit 60 วัน — จะมีอีเมลเตือน กด Enable ใหม่ได้

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 1 */3 * *" # 08:17 เวลาไทย ทุก 3 วัน
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query database (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::ยังไม่ได้ตั้ง secret SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          status=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_public_results" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_token":"keepalive-not-a-real-token"}')
          echo "HTTP $status"
          if [ "$status" != "200" ]; then cat /tmp/body; exit 1; fi
